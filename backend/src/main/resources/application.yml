server:
  port: 8080

spring:
  application:
    name: campus-activity

  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

  datasource:
    url: jdbc:mysql://localhost:3306/campus_activity?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8
    username: root
    password: root123
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# ---- 登录与权限 ----
auth:
  session-hours: ${AUTH_SESSION_HOURS:12}
  bootstrap:
    enabled: ${AUTH_BOOTSTRAP_ENABLED:true}
    publisher-password: ${AUTH_PUBLISHER_PASSWORD:publisher123}
    reviewer-password: ${AUTH_REVIEWER_PASSWORD:reviewer123}
    leader-password: ${AUTH_LEADER_PASSWORD:leader123}
    student-password: ${AUTH_STUDENT_PASSWORD:student123}

# ---- AI 配置 ----
ai:
  provider: http           # http: 直接调API | spring-ai: 后续切Spring AI
  api-key: ${AI_API_KEY:your-api-key}
  api-url: ${AI_API_URL:https://api.deepseek.com/chat/completions}
  model: ${AI_MODEL:deepseek-chat}
  image:
    api-key: ${AI_IMAGE_API_KEY:}
    api-url: ${AI_IMAGE_API_URL:https://ark.cn-beijing.volces.com/api/v3/images/generations}
    model: ${AI_IMAGE_MODEL:doubao-seedream-5-0-260128}
    storage-path: ${AI_IMAGE_STORAGE_PATH:data/generated-covers}
