server:
  port: 8080

spring:
  application:
    name: campus-activity

  datasource:
    url: jdbc:mysql://localhost:3306/campus_activity?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8mb4
    username: root
    password: root123
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# ---- AI 配置 ----
ai:
  provider: http           # http: 直接调API | spring-ai: 后续切Spring AI
  api-key: ${AI_API_KEY:your-api-key}
  api-url: ${AI_API_URL:https://api.anthropic.com/v1/messages}
  model: ${AI_MODEL:claude-sonnet-5-20250929}
