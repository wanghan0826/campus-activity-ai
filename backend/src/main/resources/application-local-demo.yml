spring:
  datasource:
    url: jdbc:h2:file:./data/campus_local;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  sql:
    init:
      mode: never

wecom:
  notification-enabled: false
  calendar-enabled: false
  group-notification-enabled: false
